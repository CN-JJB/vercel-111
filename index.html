
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="index,follow">
  <title>极简科技 | 探索数字生活</title>
  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif;
      background: #f5f7fb;
      color: #273449;
      line-height: 1.7;
    }
    header {
      background: white;
      padding: 18px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
    }
    .logo {
      color: #2563eb;
      font-size: 23px;
      font-weight: 800;
    }
    nav a {
      color: #475569;
      text-decoration: none;
      margin-left: 22px;
      font-size: 14px;
    }
    nav a:hover { color: #2563eb; }
    .hero {
      padding: 95px 20px;
      text-align: center;
      color: white;
      background: linear-gradient(130deg, #1e40af, #6366f1);
    }
    .hero h1 {
      font-size: clamp(30px, 5vw, 48px);
      margin: 0 0 15px;
    }
    .hero p {
      opacity: .9;
      font-size: 17px;
    }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 28px;
      background: white;
      color: #2563eb;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }
    main {
      max-width: 1100px;
      margin: 55px auto;
      padding: 0 20px;
    }
    h2 { font-size: 26px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }
    .card {
      background: white;
      border-radius: 13px;
      padding: 27px;
      border: 1px solid #e9edf3;
      box-shadow: 0 5px 18px #152b4b08;
    }
    .card .emoji { font-size: 35px; }
    .card h3 { margin-bottom: 8px; }
    .card p {
      color: #64748b;
      font-size: 14px;
    }
    .about {
      margin-top: 65px;
      padding: 35px;
      background: white;
      border-radius: 13px;
    }
    footer {
      padding: 30px;
      text-align: center;
      background: #172033;
      color: #94a3b8;
      font-size: 13px;
    }
    @media(max-width: 750px) {
      header { flex-direction: column; gap: 12px; }
      nav a { margin: 0 9px; }
      .grid { grid-template-columns: 1fr; }
      .hero { padding: 65px 20px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">极简科技</div>
  <nav>
    <a href="#home">首页</a>
    <a href="#articles">精选内容</a>
    <a href="#about">关于我们</a>
  </nav>
</header>

<section class="hero" id="home">
  <h1>探索科技，发现更多可能</h1>
  <p>关注数字创新，分享实用知识与生活灵感。</p>
  <a href="#articles" class="btn">开始探索 →</a>
</section>

<main>
  <section id="articles">
    <h2>精选内容</h2>
    <div class="grid">

      <article class="card">
        <div class="emoji">💻</div>
        <h3>数字生活</h3>
        <p>探索数字时代的生活方式，让技术真正服务于日常生活。</p>
      </article>

      <article class="card">
        <div class="emoji">🤖</div>
        <h3>人工智能</h3>
        <p>了解人工智能的发展与应用，发现全新的工作和学习方式。</p>
      </article>

      <article class="card">
        <div class="emoji">🌐</div>
        <h3>互联网观察</h3>
        <p>关注互联网技术的发展趋势，分享值得了解的新知识。</p>
      </article>

    </div>
  </section>

  <section class="about" id="about">
    <h2>关于本站</h2>
    <p>
      极简科技是一个专注于数字技术、科技知识和互联网文化的
      独立内容展示网站。
    </p>
    <p>
      我们希望通过简洁直观的内容，让每个人都能够轻松了解
      技术世界中的新想法。
    </p>
  </section>
</main>

<footer>
  © 2026 极简科技 · 探索数字世界
</footer>

</body>
</html>
